[project]
name = "mcp-server-google-scholar"
version = "0.3.0"
description = "An MCP server for searching and retrieving articles from Google Scholar"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.27,<2",
    "requests>=2.34,<3",
    "beautifulsoup4>=4.14,<5",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # pytest-asyncio internals on Python 3.14 ; not our code, scoped narrowly.
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning",
    "ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
